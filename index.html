<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1S · PO Book</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--ink:#16202c;--muted:#5f6c7d;--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.75);--shadow:0 8px 32px rgba(31,45,75,.12);--accentink:#1b6fae;--sel:#1b6fae;--grid:rgba(95,108,125,.16);--red:#c8412f;--redbg:#fbe1dc;--amb:#9a6a00;--ambbg:#fff1c9;--grn:#23794f;--grnbg:#dff3e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%) fixed}
#bg{position:fixed;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1680px;margin:0 auto;padding:14px 18px 24px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow)}
header.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0;font-weight:700;letter-spacing:.01em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--edge);color:var(--muted);font-size:11.5px;text-decoration:none;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#8fb8d8}
.chip.ok .dot{background:#38a169}.chip.err .dot{background:var(--red)}
.sp{flex:1}
button,.btn{font:inherit;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.75);color:var(--ink);padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:#fff}
button:disabled{opacity:.45;cursor:default}
button.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,#2f9bd6,#1b6fae)}
button.ghost{background:transparent;border-color:transparent;color:var(--accentink);padding:4px 6px}
input,select{font:inherit;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.8);color:var(--ink);padding:6px 10px;outline:none}
input:focus,select:focus{box-shadow:0 0 0 3px rgba(47,155,214,.18)}
.lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
#signin{max-width:440px;margin:12vh auto;padding:28px;text-align:center}
#signin p{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{padding:10px 12px;cursor:pointer;text-align:left;border-radius:14px}
.tile .n{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.info{cursor:default}
.tile.on{outline:2px solid var(--sel);outline-offset:-2px}
.tile.bad .n{color:var(--red)}.tile.warn .n{color:var(--amb)}
.breaks{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:12px}
.brk{padding:10px 12px}
.brk .rows{margin-top:6px;max-height:170px;overflow:auto}
.br{display:grid;grid-template-columns:130px 1fr 54px 70px;gap:8px;align-items:center;padding:3px 4px;border-radius:8px;cursor:pointer;font-size:12px}
.br:hover{background:rgba(255,255,255,.7)}
.br.on{background:rgba(47,155,214,.14)}
.br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .bar{height:7px;border-radius:4px;background:rgba(95,108,125,.12);overflow:hidden}
.br .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f9bd6,#1b6fae);border-radius:4px}
.br .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.gridcard{padding:10px 12px 12px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{border-radius:11px;padding:6px 14px;background:transparent;border-color:transparent;color:var(--muted);font-weight:600}
.tab.on{background:rgba(255,255,255,.85);border-color:var(--edge);color:var(--ink)}
.tab .c{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:rgba(95,108,125,.12);font-size:11px}
.tab.iss .c{background:var(--redbg);color:var(--red)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.toolbar input[type=search]{width:230px}
.toolbar select{max-width:170px}
.selinfo{color:var(--muted);font-size:12px}
.pane{position:relative;overflow:auto;height:calc(100vh - 160px);min-height:420px;border-radius:12px;background:rgba(255,255,255,.35);border:1px solid var(--edge)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
th,td{padding:5px 9px;border-bottom:1px solid var(--grid);white-space:nowrap;text-align:left;background:clip-padding-box}
th{position:sticky;top:0;z-index:3;background:rgba(240,245,251,.97);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
th.ns{cursor:default}
th .ar{font-size:9px;margin-left:3px}
td{background:rgba(255,255,255,.55)}
tr:hover td{background:rgba(255,255,255,.78)}
tr.sel td{background:rgba(47,155,214,.12)}
.fz{position:sticky;z-index:2}
th.fz{z-index:4}
.f0{left:0;width:34px;min-width:34px;text-align:center}
.f1{left:34px;width:132px;min-width:132px;max-width:132px;overflow:hidden;text-overflow:ellipsis}
.f2{left:166px;min-width:100px;box-shadow:inset -1px 0 0 var(--grid)}
td.fz{background:rgba(248,250,253,.97)}
tr.sel td.fz{background:#e3eff8}
td.po{color:var(--accentink);font-weight:600;cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.desc{max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.late{color:var(--red);font-weight:600}
.pill{display:inline-block;min-width:34px;text-align:center;padding:1px 7px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.r{background:var(--redbg);color:var(--red)}.pill.a{background:var(--ambbg);color:var(--amb)}.pill.g{background:var(--grnbg);color:var(--grn)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(95,108,125,.12);color:var(--muted);margin-left:4px}
.tag.bo{background:#efe6fb;color:#6b3fa0}
input.crd{padding:2px 6px;border-radius:8px;font-size:12px;width:128px}
td.empty{padding:40px;text-align:center;color:var(--muted);background:transparent}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(246,249,253,.75);z-index:6;color:var(--muted)}
#loader[hidden]{display:none}
#loader .msg{font-weight:600;color:var(--ink)}
.ship{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 80%}
.wave{animation:drift 3s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.mini{display:inline-block;width:12px;height:12px;border:2px solid rgba(27,111,174,.25);border-top-color:var(--accentink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ship,.wave,.mini{animation:none}}
dialog{border:none;padding:0;background:transparent;max-width:440px;width:92vw}
dialog::backdrop{background:rgba(22,32,44,.25);backdrop-filter:blur(2px)}
.dlg{padding:18px 20px}
.dlg h3{margin:0 0 10px;font-size:15px}
.dlg .row{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .note{color:var(--muted);font-size:12px}
.dlg .err{color:var(--red);font-size:12px;white-space:pre-wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;padding:9px 16px;display:none}
@media (max-width:1200px){.tiles{grid-template-columns:repeat(2,1fr)}.breaks{grid-template-columns:1fr}}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(95,108,125,.1);margin-right:12px}
.seg button{border:none;background:transparent;padding:5px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(31,45,75,.12)}
#poChip{cursor:pointer;color:var(--accentink)}
dialog.wide{max-width:780px}
.sq{max-height:48vh;overflow:auto;border:1px solid var(--edge);border-radius:10px;background:rgba(255,255,255,.5)}
.sq table{width:100%}.sq th{cursor:default}
.sq input{padding:3px 6px;border-radius:8px}.sq .sqq{width:96px}.sq .sqd{width:136px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <header class="glass bar">
    <h1>M1S · PO Book</h1>
    <a class="chip" id="srcT" target="_blank" rel="noopener"><span class="dot"></span>PO Status Tracker <b>–</b></a>
    <a class="chip" id="srcM" target="_blank" rel="noopener"><span class="dot"></span>Master Sheet Live <b>–</b></a>
    <span id="busy" class="chip" hidden><span class="mini"></span>Refreshing <button class="ghost" id="btnCancelBusy">Cancel</button></span>
    <span class="sp"></span>
    <button id="btnRefresh" hidden>Refresh</button>
    <button id="btnSettings" hidden title="Buffer and refresh settings">Settings</button>
    <span id="who" class="chip" hidden></span>
  </header>

  <section id="signin" class="glass" hidden>
    <h2 style="margin:0 0 6px">PO Book</h2>
    <p id="signinMsg">Sign in with your M1S account to see live open POs.</p>
    <button class="primary" id="btnSignin">Sign in</button>
  </section>

  <section id="app" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="breaks">
      <div class="glass brk"><div class="lbl">Open by supplier · $ value</div><div class="rows" id="bkSup"></div></div>
      <div class="glass brk"><div class="lbl">Open by PO type</div><div class="rows" id="bkType"></div></div>
    </div>
    <div class="glass gridcard">
      <div class="tabs" id="tabs">
        <div class="seg" id="views"><button data-v="po" class="on" title="One row per PO">POs</button><button data-v="style" title="One row per style">Styles</button></div>
        <button class="tab on" data-tab="open">Open<span class="c" id="cOpen">0</span></button>
        <button class="tab" data-tab="shipped">Shipped<span class="c" id="cShip">0</span></button>
        <button class="tab iss" data-tab="issues">Issues<span class="c" id="cIss">0</span></button>
      </div>
      <div class="toolbar" id="toolbar">
        <input type="search" id="q" placeholder="Search PO, style, description, customer PO…">
        <select id="fSup"></select><select id="fCust"></select><select id="fType"></select>
        <span class="chip" id="poChip" hidden title="Clear PO filter"></span>
        <button class="ghost" id="btnClear">Clear filters</button>
        <span class="sp"></span>
        <span class="selinfo" id="selInfo"></span>
        <button class="ghost" id="btnSelNone" hidden>Clear selection</button>
        <button class="primary" id="btnShip" disabled>Mark shipped</button>
        <button id="btnUnship" disabled hidden>Move back to Open</button>
        <button id="btnExport" disabled>Export POs</button>
      </div>
      <div class="pane" id="pane">
        <table id="grid"></table>
        <div id="loader" hidden>
          <svg width="150" height="86" viewBox="0 0 150 86" aria-hidden="true">
            <g class="ship">
              <rect x="40" y="24" width="18" height="14" rx="2" fill="#2f9bd6"/><rect x="60" y="24" width="18" height="14" rx="2" fill="#f2734a"/><rect x="80" y="24" width="18" height="14" rx="2" fill="#38a169"/>
              <rect x="50" y="10" width="18" height="14" rx="2" fill="#8a6fd1"/><rect x="70" y="10" width="18" height="14" rx="2" fill="#2f9bd6"/>
              <rect x="100" y="16" width="12" height="22" rx="2" fill="#16202c" opacity=".8"/>
              <path d="M26 38h100l-12 18H38z" fill="#1b6fae"/>
            </g>
            <g class="wave"><path d="M0 62q10-6 20 0t20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0" stroke="#8fb8d8" stroke-width="3" fill="none"/></g>
          </svg>
          <div class="msg" id="loadMsg">Loading…</div>
          <button id="btnCancelLoad">Cancel</button>
        </div>
      </div>
    </div>
  </section>
</div>
<dialog id="dlg"><div class="glass dlg" id="dlgBody"></div></dialog>
<div id="toast" class="glass"></div>

<script id="core">
/*CORE-START*/
const DAY=864e5;
const S=v=>String(v??'').trim();
const normSty=v=>String(v??'').replace(/\s+/g,'').toUpperCase();
const num=v=>(v==null||v===''||isNaN(+v))?null:+v;
function ymd(y,m,d){if(y<2000||y>2200||m<1||m>12||d<1)return null;const t=Date.UTC(y,m-1,d);return new Date(t).getUTCDate()===d?t/DAY:null;}
function toDay(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return v>=36526?Math.floor(v)-25569:null;
  if(v instanceof Date)return isNaN(v)?null:ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
  const s=S(v);let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return ymd(y,+m[1],+m[2]);}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?ymd(+m[1],+m[2],+m[3]):null;
}
const dayYear=d=>new Date(d*DAY).getUTCFullYear();
const fmtDay=d=>{if(d==null)return'';const o=new Date(d*DAY);return(o.getUTCMonth()+1)+'/'+o.getUTCDate()+'/'+o.getUTCFullYear();};
const isoDay=d=>d==null?'':new Date(d*DAY).toISOString().slice(0,10);
const todayDay=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/DAY;};
const DT='\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?';
function mkdate(s,anchor,after){
  const p=s.split('/').map(Number);let y;
  if(p.length===3)y=p[2]<100?p[2]+2000:p[2];
  else{const b=after??anchor;if(b==null)return null;y=dayYear(b);}
  let d=ymd(y,p[0],p[1]);if(d==null)return null;
  if(p.length===2){
    if(after!=null&&d<after)d=ymd(y+1,p[0],p[1]);
    else if(after==null&&anchor!=null&&d<anchor-45)d=ymd(y+1,p[0],p[1]);
  }
  return d;
}
function parseNotes(raw,anchor){
  const n=String(raw??'').replace(/\([^)]*\)/g,'');
  let cpo=[];const mm=/\bPO\b[ \t]*#?[ \t]*:?[ \t]*/i.exec(n);
  if(mm){
    const lines=n.slice(mm.index+mm[0].length).split('\n');
    for(let k=0;k<lines.length;k++){
      const l=lines[k].trim(),nums=l.match(/\d[\d-]{4,}/g)||[];
      if(k===0&&nums.length){cpo.push(nums[0]);break;}
      if(k>0&&nums.length&&/^[\d\s,&-]+$/.test(l)){cpo.push(...nums);continue;}
      if(k>0)break;
    }
  }
  cpo=cpo.filter(c=>!/^10[0-2]\d{3}$/.test(c));
  let cs=null,cc=null;
  let w=new RegExp('\\bSW\\b\\s*:?\\s*('+DT+')\\s*-\\s*/?\\s*('+DT+')','i').exec(n);
  if(w){cs=mkdate(w[1],anchor);cc=cs!=null?mkdate(w[2],anchor,cs):null;}
  else{w=new RegExp('SHIP\\s*(?:DATE)?\\s*:?\\s*('+DT+')','i').exec(n);if(w)cs=mkdate(w[1],anchor);}
  return{cpo:cpo.join(', '),cs,cc};
}
function cols(h,want,sheet){
  const o={};for(const[k,name]of Object.entries(want)){const i=h.findIndex(x=>x===name);if(i<0)throw new Error(`${sheet}: missing column "${name}"`);o[k]=i;}return o;
}
function parseTracker(rows){
  const h=(rows[0]||[]).map(S);
  const c=cols(h,{po:'PO#',sup:'Supplier',od:'Order date',desc:'Item Description',sty:'Style #',type:'Order Type',cust:'Customer',first:'Customer 1st Ship Date',exp:'CRD Expected',crd:'Factory CRD'},'PO Status Tracker');
  const T=new Map(),all=[];let minPO=Infinity;
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const po=S(r[c.po]),b=po.replace(/\s/g,'').match(/^(\d{6})/);if(!b)continue;
    minPO=Math.min(minPO,+b[1]);
    const sty=normSty(r[c.sty]);if(!sty)continue;
    const t={po,base:b[1],sty,styRaw:S(r[c.sty]),sup:S(r[c.sup]),od:toDay(r[c.od]),desc:S(r[c.desc]),type:S(r[c.type]),cust:S(r[c.cust]),first:toDay(r[c.first]),exp:toDay(r[c.exp]),crd:toDay(r[c.crd])};
    T.set(t.base+'|'+sty,t);all.push(t);
  }
  for(const t of all)if(t.sty.endsWith('-F')&&!T.has(t.base+'|'+t.sty.slice(0,-2)))T.set(t.base+'|'+t.sty.slice(0,-2),t);
  return{T,all,minPO};
}
function parseMaster(rows,trk){
  const h=(rows[0]||[]).map(S);
  const c=cols(h,{name:'Product name',sty:'Style Number',price:'Price',qty:'Quantity',po:'Po Number',fac:'Factory',od:'Order Date',sb:'Ship by',notes:'Notes'},'Master Sheet Live');
  const isRound=r=>r&&/^\s*Round/i.test(S(r[c.name]));
  let last=-1;for(let i=1;i<rows.length;i++)if(isRound(rows[i]))last=i;
  const lines=[],issues=[],seen=new Set(),used=new Map();let blk=null;
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    if(isRound(r)){blk=null;continue;}
    const pc=S(r[c.po]);
    if(pc)blk={po:pc,fac:S(r[c.fac]),od:toDay(r[c.od]),sb:toDay(r[c.sb]),notes:r[c.notes]};
    if(!blk)continue;
    const b=blk.po.replace(/\s/g,'').match(/^(\d{6})/);if(!b||+b[1]<trk.minPO)continue;
    const base=b[1],sty=normSty(r[c.sty]);
    if(!sty){if(S(r[c.name]))issues.push({po:blk.po,sty:'',desc:S(r[c.name]),issue:'No style # on the Master Sheet Live line — left out'});continue;}
    const tr=trk.T.get(base+'|'+sty)||trk.T.get(base+'|'+(sty.endsWith('-F')?sty.slice(0,-2):sty+'-F'));
    seen.add(base+'|'+(tr?tr.sty:sty));
    const od=(tr&&tr.od)??blk.od,n=parseNotes(blk.notes,od);
    const bo=/-\d+$/.test(blk.po);
    const crd=bo?blk.sb:(tr?(tr.crd??tr.exp??blk.sb):blk.sb);
    const cust=tr?tr.cust:'';
    let key=(blk.po+'|'+sty).toUpperCase();const u=(used.get(key)||0)+1;used.set(key,u);if(u>1)key+='#'+u;
    if(!tr)issues.push({po:blk.po,sty:S(r[c.sty]),desc:S(r[c.name]),issue:'Not on the PO Status Tracker — shown with Master Sheet data only'});
    lines.push({key,po:blk.po,base,sty:S(r[c.sty]),desc:(tr&&tr.desc)||S(r[c.name]),sup:(tr&&tr.sup)||blk.fac,od,qty:num(r[c.qty]),price:num(r[c.price]),
      crd,ptype:tr&&tr.type==='China Pickup'?'China Pickup':'LA',cust,cpo:cust==='M1S Stock'?'':n.cpo,cs:n.cs??(tr?tr.first:null),cc:n.cc,
      src:i>last?'open':'round',bo,tracked:!!tr,row:i+1});
  }
  const inRound=new Map();for(const l of lines)if(l.src==='round'){const k=l.key.split('#')[0];(inRound.get(k)||inRound.set(k,[]).get(k)).push(l.qty);}
  for(const l of lines)if(l.src==='open'&&(inRound.get(l.key.split('#')[0])||[]).includes(l.qty)){
    l.src='round';l.dupRound=true;
    issues.push({po:l.po,sty:l.sty,desc:l.desc,issue:`Master Sheet row ${l.row} is below the last Round but the same line/qty is already inside a Round — counted as shipped`});
  }
  for(const t of trk.all){
    const k=t.base+'|'+t.sty;
    if(!seen.has(k)&&!seen.has(k+'-F')&&!(t.sty.endsWith('-F')&&seen.has(k.slice(0,-2))))
      issues.push({po:t.po,sty:t.styRaw,desc:t.desc,issue:'On the PO Status Tracker but not on Master Sheet Live — no qty/price, not shown'});
  }
  lines.sort(cmpPO);
  return{lines,issues};
}
function cmpPO(a,b){return(+a.base-+b.base)||a.po.localeCompare(b.po,undefined,{numeric:true})||String(a.sty??'').localeCompare(String(b.sty??''),undefined,{numeric:true});}
function applyOverlay(src,ov,cfg){
  const lines=src.lines.map(l=>({...l,splitOut:0})),byKey=new Map(lines.map(l=>[l.key,l]));
  for(const o of ov.values()){
    if(o.Kind!=='split'||byKey.has(o.LineKey))continue;
    const p=byKey.get(o.ParentKey);if(!p)continue;
    const q=+o.Qty||0;p.qty=(p.qty??0)-q;p.splitOut+=q;
    const nl={...p,key:o.LineKey,po:o.PONumber,qty:q,crd:toDay(o.CRDOverride)??p.crd,bo:true,split:true,parentKey:p.key,splitOut:0,src:'open'};
    lines.push(nl);byKey.set(nl.key,nl);
  }
  for(const l of lines){
    const o=ov.get(l.key);
    if(o&&l.bo&&!l.split&&toDay(o.CRDOverride)!=null)l.crd=toDay(o.CRDOverride);
    l.manual=!!(o&&o.Shipped===true);l.shipDate=l.manual?S(o.ShippedDate):'';l.shipBy=l.manual?S(o.ShippedBy):'';
    l.status=(l.src==='round'||l.manual)?'shipped':'open';
    l.buf=(l.cs!=null&&l.crd!=null)?l.cs-l.crd-(l.ptype==='LA'?cfg.la:0):null;
    l.val=(l.qty??0)*(l.price??0);
  }
  lines.sort(cmpPO);
  return lines;
}
/*CORE-END*/
</script>

/* ---------- background ---------- */

/* ---------- auth + graph ---------- */
const framed=window.self!==window.top;let pca,account;

$('btnSignin').onclick=async()=>{

async function token(force){
  try{return(await pca.acquireTokenSilent({scopes:SCOPES,account,forceRefresh:!!force})).accessToken;}
  catch(e){if(framed)return(await pca.acquireTokenPopup({scopes:SCOPES})).accessToken;await pca.acquireTokenRedirect({scopes:SCOPES});throw e;}
}
async function g(url,opt={},tries=0){
  const t=await token(tries===1);

  const r=await fetch(url.startsWith('http')?url:'https://graph.microsoft.com/v1.0'+url,{...opt,headers});
  if(r.status===401&&tries===0)return g(url,opt,1);
  if((r.status===429||r.status===503)&&tries<5){await sleep((+(r.headers.get('Retry-After')||2))*1000);return g(url,opt,tries+2);}
  if(!r.ok){const e=new Error(`${r.status}: ${(await r.text()).slice(0,300)}`);e.status=r.status;throw e;}

}
const gj=async(u,o)=>(await g(u,o)).json();
async function step(label,fn){try{return await fn();}catch(e){if(e.name==='AbortError')throw e;const x=new Error(`${label} — ${e.status===403?'access denied (403)':e.message}`);x.status=e.status;throw x;}}
async function tokenScopes(){try{const t=await token();return String(JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).scp||'');}catch{return'';}}

/* ---------- state ---------- */
let siteId,listPath,ov=new Map(),cfg={...DEF_CFG},cfgItem=null;

const selL=new Set(),selP=new Set();let loading=null,timer=null;

/* ---------- list (overlay) ---------- */
async function ensureList(){
  if(!siteId)siteId=(await step('Opening the Production site',()=>gj(`/sites/${SITE}?$select=id`))).id;
  let list;
  try{list=await gj(`/sites/${siteId}/lists/${LIST_NAME}?$select=id`);}
  catch(e){
    if(e.status!==404)throw new Error(`Opening the ${LIST_NAME} list — ${e.status===403?'access denied (403)':e.message}`);
    const body=idx=>JSON.stringify({displayName:LIST_NAME,list:{template:'genericList'},columns:[{name:'LineKey',text:{},...(idx?{indexed:true}:{})},{name:'Kind',text:{}},{name:'PONumber',text:{}},{name:'Style',text:{}},{name:'ParentKey',text:{}},{name:'Qty',number:{}},{name:'Shipped',boolean:{}},{name:'ShippedDate',text:{}},{name:'ShippedBy',text:{}},{name:'CRDOverride',text:{}},{name:'Data',text:{allowMultipleLines:true}}]});
    try{list=await gj(`/sites/${siteId}/lists`,{method:'POST',body:body(true)});}
    catch(e2){try{list=await gj(`/sites/${siteId}/lists`,{method:'POST',body:body(false)});}
      catch(e3){throw new Error(e3.status===403?`The ${LIST_NAME} list doesn't exist yet and this app isn't allowed to create lists — create it once in SharePoint (Production site), then reload.`:`Creating the ${LIST_NAME} list — ${e3.message}`);}}
  }

}
async function loadOverlay(){
  const m=new Map();let url=`${listPath}/items?$expand=fields($select=LineKey,Kind,PONumber,Style,ParentKey,Qty,Shipped,ShippedDate,ShippedBy,CRDOverride,Data)&$top=999`;
  while(url){const j=await gj(url);for(const it of j.value){const f=it.fields||{};if(!f.LineKey)continue;const prev=m.get(f.LineKey);if(!prev||it.lastModifiedDateTime>prev._lm)m.set(f.LineKey,{...f,_id:it.id,_lm:it.lastModifiedDateTime});}url=j['@odata.nextLink'];}

  try{cfg={...DEF_CFG,...(cfgItem?JSON.parse(cfgItem.Data||'{}'):{})};}catch{cfg={...DEF_CFG};}

}
async function saveCfg(){
  const Data=JSON.stringify(cfg);
  if(cfgItem?._id){await g(`${listPath}/items/${cfgItem._id}/fields`,{method:'PATCH',body:JSON.stringify({Data})});cfgItem.Data=Data;}
  else{const r=await gj(`${listPath}/items`,{method:'POST',body:JSON.stringify({fields:{Title:'__settings',LineKey:'__settings',Kind:'settings',Data}})});cfgItem={Data,_id:r.id};}
}
/* ops: {key, fields} upsert | {key, del:true}; batched 20 per call */
async function writeOps(ops,signal,onProgress){
  let done=0;const reqs=ops.map((o,i)=>{const ex=ov.get(o.key);
    if(o.del)return ex?._id?{id:String(i),method:'DELETE',url:`${listPath}/items/${ex._id}`}:null;
    return ex?._id?{id:String(i),method:'PATCH',url:`${listPath}/items/${ex._id}/fields`,headers:{'Content-Type':'application/json'},body:o.fields}
      :{id:String(i),method:'POST',url:`${listPath}/items`,headers:{'Content-Type':'application/json'},body:{fields:{Title:o.key,LineKey:o.key,Shipped:false,...o.fields}}};
  }).filter(Boolean);
  const fails=[];
  for(let s=0;s<reqs.length;s+=20){
    if(signal?.aborted)break;
    let chunk=reqs.slice(s,s+20);
    for(let attempt=0;attempt<3&&chunk.length;attempt++){
      const j=await gj('/$batch',{method:'POST',body:JSON.stringify({requests:chunk})});
      const retry=[];
      for(const r of j.responses){const q=chunk.find(c=>c.id===r.id);if(r.status===429||r.status===503)retry.push(q);else if(r.status>=400)fails.push(`${ops[+r.id].key}: ${r.status}`);else done++;}
      chunk=retry;if(retry.length)await sleep(2000);
    }
    onProgress?.(done,reqs.length);
  }
  return{done,total:reqs.length,fails};
}

/* ---------- sources ---------- */
const shareId=u=>'u!'+btoa(unescape(encodeURIComponent(u))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
async function getItem(k){

  catch(e){
    if(e.status!==403&&e.status!==404)throw e;
    const name=SOURCES[k].name,hits=[];
    for(const d of(await gj(`/sites/${siteId}/drives?$select=id`)).value){
      const r=await gj(`/drives/${d.id}/root/search(q='${encodeURIComponent(name.replace(/'/g,"''"))}')?$select=id,name,parentReference,lastModifiedDateTime`);
      hits.push(...r.value.filter(x=>x.name.toLowerCase()===name.toLowerCase()));
    }

async function loadSource(k,force,signal){

/* ---------- load cycle ---------- */
function msg(t){$('loadMsg').textContent=t;}
async function loadAll(force,quiet){
  if(loading)return;
  const ctl=new AbortController();loading=ctl;
  const showBig=!quiet&&!lines.length;
  $('loader').hidden=!showBig;$('busy').hidden=showBig;
  try{

    if(!listPath)await ensureList();

$('btnCancelLoad').onclick=$('btnCancelBusy').onclick=()=>loading?.abort();

/* ---------- filters + dashboard ---------- */
function baseFilter(l){
  if(st.po&&l.po!==st.po)return false;
  if(st.sup&&l.sup!==st.sup)return false;
  if(st.cust&&l.cust!==st.cust)return false;
  if(st.type&&l.ptype!==st.type)return false;
  if(st.q){const q=st.q.toLowerCase();if(![l.po,l.sty,l.desc,l.cpo,l.sup,l.cust].some(v=>String(v??'').toLowerCase().includes(q)))return false;}
  return true;
}
const T0=()=>todayDay();
const uniq=a=>[...new Set(a.filter(v=>v!=null&&v!==''))];
function groupPOs(){const m=new Map();for(const l of lines){let a=m.get(l.po);if(!a)m.set(l.po,a=[]);a.push(l);}return m;}
function aggPO(po,ls,all){
  const nums=k=>ls.map(l=>l[k]).filter(v=>v!=null),crd=nums('crd'),cs=nums('cs'),cc=nums('cc'),types=uniq(ls.map(l=>l.ptype));
  const r={key:po,po,base:ls[0].base,od:ls[0].od,sup:uniq(ls.map(l=>l.sup)).join(', '),styles:ls.length,total:all.length,
    qty:ls.reduce((s,l)=>s+(l.qty||0),0),val:ls.reduce((s,l)=>s+l.val,0),crd:crd.length?Math.max(...crd):null,crdMin:crd.length?Math.min(...crd):null,
    ptype:types.length>1?'Mixed':(types[0]||''),cust:uniq(ls.map(l=>l.cust)).join(', '),cpo:uniq(ls.flatMap(l=>String(l.cpo||'').split(', '))).join(', '),
    cs:cs.length?Math.min(...cs):null,cc:cc.length?Math.min(...cc):null,lines:ls,bo:ls.some(l=>l.bo),tracked:ls.every(l=>l.tracked)};
  if(r.ptype!=='Mixed'&&r.cs!=null&&r.crd!=null)r.buf=r.cs-r.crd-(r.ptype==='LA'?cfg.la:0);
  else{const b=nums('buf');r.buf=b.length?Math.min(...b):null;}
  const man=ls.filter(l=>l.manual);r.manual=man.length>0;r.round=ls.some(l=>l.src==='round'&&!l.manual);
  r.shipInfo=uniq(man.map(l=>`${fmtDay(toDay(l.shipDate))} · ${l.shipBy}`)).join('; ');
  return r;
}
function poRows(status,filtered=true){
  const out=[];
  for(const[po,all]of groupPOs()){
    const open=all.filter(l=>l.status==='open'),s=open.length?'open':'shipped';
    if(s!==status)continue;
    const ls=s==='open'?open:all;
    if(filtered&&!ls.some(baseFilter))continue;

  }
  return out.sort(cmpPO);
}
function viewRows(){
  if(st.tab==='issues'){const q=st.q.toLowerCase();return issues.filter(i=>!q||[i.po,i.sty,i.desc,i.issue].some(v=>String(v).toLowerCase().includes(q)));}
  let r=st.view==='po'?poRows(st.tab):lines.filter(l=>l.status===st.tab&&baseFilter(l));
  if(st.sort){const{k,dir}=st.sort;r=[...r].sort((a,b)=>{const x=a[k],y=b[k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*dir;});}
  return r;
}
function renderTiles(){
  const o=lines.filter(l=>l.status==='open'&&baseFilter(l));
  const pos=new Set(o.map(l=>l.po)).size,units=o.reduce((s,l)=>s+(l.qty||0),0),val=o.reduce((s,l)=>s+l.val,0);
  $('tiles').innerHTML=[['Open POs',pos.toLocaleString()],['Open lines',o.length.toLocaleString()],['Units',int(units)],['Value',money(val)]]
    .map(([t,n])=>`<div class="glass tile"><div class="lbl">${t}</div><div class="n">${n}</div></div>`).join('');
  const brk=(el,key,keyOf)=>{const m=new Map();for(const l of o){const k=keyOf(l)||'(blank)';const e=m.get(k)||{n:0,v:0};e.n++;e.v+=l.val;m.set(k,e);}
    const arr=[...m].sort((a,b)=>b[1].v-a[1].v),mx=Math.max(1,...arr.map(a=>a[1].v));
    $(el).innerHTML=arr.map(([k,e])=>`<div class="br ${st[key]===k?'on':''}" data-f="${key}" data-v="${esc(k)}" title="${esc(k)}"><span class="nm">${esc(k)}</span><span class="bar"><i style="width:${(e.v/mx*100).toFixed(1)}%"></i></span><span class="v">${e.n} ln</span><span class="v">${money(e.v)}</span></div>`).join('')||'<div class="note">No open lines</div>';};
  brk('bkSup','sup',l=>l.sup);brk('bkType','type',l=>l.ptype);

function fillSelects(){

}

const LCOLS=[
  {k:'po',t:'PO #',cls:'fz f1 po'},{k:'sty',t:'Style#',cls:'fz f2'},{k:'desc',t:'Description',cls:'desc'},{k:'sup',t:'Supplier'},
  {k:'od',t:'PO Date',d:1},{k:'qty',t:'PO Qty',cls:'num'},{k:'price',t:'Price',cls:'num'},{k:'crd',t:'Factory CRD',d:1},{k:'ptype',t:'PO Type'},
  {k:'cust',t:'Cust. Name'},{k:'cpo',t:'Customer PO#'},{k:'cs',t:'Cust. Start',d:1},{k:'cc',t:'Cust. Cancel',d:1},{k:'buf',t:'Buffer',cls:'num'}
];

  {k:'po',t:'PO #',cls:'fz f1 po'},{k:'sup',t:'Supplier',cls:'fz f2'},{k:'od',t:'PO Date',d:1},{k:'styles',t:'Styles',cls:'num'},{k:'qty',t:'PO Qty',cls:'num'},

  {k:'cs',t:'Cust. Start',d:1},{k:'cc',t:'Cust. Cancel',d:1},{k:'buf',t:'Buffer',cls:'num'}

function cell(l,c,isPO){

    if(!isPO&&st.tab==='open'&&l.bo)return`<td><input type="date" class="crd" data-k="${esc(l.key)}" value="${isoDay(v)}" title="Backorder date — saves automatically"></td>`;

  if(c.d)return`<td>${fmtDay(v)}</td>`;
  if(c.k==='buf'){if(v==null)return'<td></td>';const k=v<0?'r':v<=cfg.amber?'a':'g';return`<td class="num"><span class="pill ${st.tab==='open'?k:''}">${v}</span></td>`;}
  if(c.k==='qty')return`<td class="num">${int(v)}${l.splitOut?`<span class="tag" title="${int(l.splitOut)} moved to backorder">−${int(l.splitOut)}</span>`:''}</td>`;
  if(c.k==='val')return`<td class="num">${money(v)}</td>`;
  if(c.k==='styles')return`<td class="num" title="${st.tab==='open'?'Open styles / all styles on the PO':''}">${v}${st.tab==='open'&&l.total!==v?` / ${l.total}`:''}</td>`;
  if(c.k==='price')return`<td class="num">${v==null?'':'$'+(+v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4})}</td>`;
  if(c.k==='po')return`<td class="${c.cls}" title="${isPO?'Open the style breakdown':'Click to tick every line on this PO'}">${esc(v)}${l.bo?'<span class="tag bo">BO</span>':''}${l.tracked?'':'<span class="tag" title="Not on the PO Status Tracker">MSL only</span>'}</td>`;
  if(c.k==='desc')return`<td class="desc" title="${esc(v)}">${esc(v)}</td>`;
  return`<td class="${c.cls||''}" title="${esc(v)}">${esc(v)}</td>`;
}
const curSel=()=>st.view==='po'?selP:selL;
function render(){
  const isPO=st.view==='po',G=groupPOs();
  let po={open:0,shipped:0};for(const all of G.values())po[all.some(l=>l.status==='open')?'open':'shipped']++;
  $('cOpen').textContent=(isPO?po.open:lines.filter(l=>l.status==='open').length).toLocaleString();
  $('cShip').textContent=(isPO?po.shipped:lines.filter(l=>l.status==='shipped').length).toLocaleString();
  $('cIss').textContent=issues.length;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===st.tab));
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.view));
  $('poChip').hidden=!st.po;$('poChip').innerHTML=st.po?`PO <b>${esc(st.po)}</b> ✕`:'';
  renderTiles();
  const rows=viewRows(),g=$('grid'),set=curSel(),COLS=isPO?PCOLS:LCOLS;
  const ar=k=>st.sort?.k===k?`<span class="ar">${st.sort.dir>0?'▲':'▼'}</span>`:'';
  if(st.tab==='issues'){
    g.innerHTML=`<thead><tr><th class="ns">PO #</th><th class="ns">Style#</th><th class="ns">Description</th><th class="ns">Issue</th></tr></thead><tbody>`+
      (rows.map(i=>`<tr><td>${esc(i.po)}</td><td>${esc(i.sty)}</td><td>${esc(i.desc)}</td><td>${esc(i.issue)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No issues</td></tr>')+'</tbody>';
  }else{
    const actCol=st.tab==='shipped'||!isPO;
    const extra=!actCol?'':st.tab==='open'?'<th class="ns"></th>':'<th class="ns">Shipped</th>';
    const allOn=rows.length&&rows.every(l=>set.has(l.key));
    let h=`<thead><tr><th class="fz f0 ns"><input type="checkbox" id="selAll" ${allOn?'checked':''} title="Tick all shown"></th>`+COLS.map(c=>`<th class="${c.cls?.includes('fz')?c.cls.replace(' po',''):''}" data-s="${c.k}">${c.t}${ar(c.k)}</th>`).join('')+extra+'</tr></thead><tbody>';
    for(const l of rows){
      const on=set.has(l.key);
      h+=`<tr data-k="${esc(l.key)}" class="${on?'sel':''}"><td class="fz f0"><input type="checkbox" class="rs" ${on?'checked':''}></td>`+COLS.map(c=>cell(l,c,isPO)).join('');
      if(actCol){
        if(st.tab==='open')h+=`<td>${l.split?'<button class="ghost" data-act="unsplit" title="Remove this backorder line">Undo backorder</button>':(l.qty>1?'<button class="ghost" data-act="split" title="Move part of this line to a backorder">Backorder…</button>':'')}</td>`;
        else h+=`<td>${esc(l.manual?(isPO?l.shipInfo:`${fmtDay(toDay(l.shipDate))} · ${l.shipBy}`):'')}${(isPO?l.round:!l.manual)?'<span class="tag">Round</span>':''}</td>`;
      }
      h+='</tr>';
    }
    if(!rows.length)h+=`<tr><td colspan="${COLS.length+2}" class="empty">${lines.length?'Nothing matches these filters':''}</td></tr>`;
    g.innerHTML=h+'</tbody>';
  }
  updateSel();
}
const selLines=pred=>st.view==='po'?lines.filter(l=>selP.has(l.po)&&pred(l)):[...selL].map(k=>lineMap.get(k)).filter(l=>l&&pred(l));
function updateSel(){
  const isPO=st.view==='po',n=curSel().size;
  $('selInfo').textContent=n?`${n.toLocaleString()} ${isPO?'PO':'line'}${n===1?'':'s'} ticked`:'';
  $('btnSelNone').hidden=!n;
  $('btnShip').hidden=st.tab!=='open';$('btnShip').disabled=!selLines(l=>l.status==='open').length;
  $('btnUnship').hidden=st.tab!=='shipped';$('btnUnship').disabled=!selLines(l=>l.manual).length;
  $('btnExport').disabled=!n;$('btnExport').hidden=st.tab==='issues';
  $('btnExport').textContent=isPO?'Export POs':'Export styles';
}

/* ---------- events ---------- */
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;st.tab=b.dataset.tab;st.sort=null;render();$('pane').scrollTop=0;};
$('views').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===st.view)return;st.view=b.dataset.v;st.sort=null;if(st.view==='po')st.po='';if(st.tab==='issues')st.tab='open';render();$('pane').scrollTop=0;};
$('poChip').onclick=()=>{st.po='';render();};
document.querySelector('.breaks').onclick=e=>{const b=e.target.closest('.br');if(!b)return;const f=b.dataset.f;st[f]=st[f]===b.dataset.v?'':b.dataset.v;if(st.tab==='issues')st.tab='open';fillSelects();render();};
let qt;$('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();render();},200);};
$('fSup').onchange=e=>{st.sup=e.target.value;render();};
$('fCust').onchange=e=>{st.cust=e.target.value;render();};
$('fType').onchange=e=>{st.type=e.target.value;render();};
$('btnClear').onclick=()=>{Object.assign(st,{q:'',sup:'',cust:'',type:'',po:''});$('q').value='';fillSelects();render();};
$('btnSelNone').onclick=()=>{curSel().clear();render();};
$('btnRefresh').onclick=()=>loadAll(true,true);
$('grid').addEventListener('click',e=>{
  const th=e.target.closest('th[data-s]');
  if(th){const k=th.dataset.s;st.sort=st.sort?.k===k?(st.sort.dir>0?{k,dir:-1}:null):{k,dir:1};render();return;}
  const set=curSel();
  if(e.target.id==='selAll'){const rows=viewRows();if(e.target.checked)rows.forEach(l=>set.add(l.key));else rows.forEach(l=>set.delete(l.key));render();return;}
  const tr=e.target.closest('tr[data-k]');if(!tr)return;const key=tr.dataset.k;
  if(e.target.classList.contains('rs')){e.target.checked?set.add(key):set.delete(key);tr.classList.toggle('sel',e.target.checked);updateSel();return;}
  if(st.view==='po'){if(e.target.closest('td.po')){st.view='style';st.po=key;st.sort=null;render();$('pane').scrollTop=0;}return;}
  const l=lineMap.get(key);if(!l)return;
  if(e.target.closest('td.po')){const same=viewRows().filter(x=>x.po===l.po),all=same.every(x=>selL.has(x.key));same.forEach(x=>all?selL.delete(x.key):selL.add(x.key));render();return;}
  const act=e.target.dataset.act;if(act==='split')splitDlg(l);if(act==='unsplit')unsplit(l);
});
$('grid').addEventListener('change',async e=>{
  if(!e.target.classList.contains('crd'))return;
  const key=e.target.dataset.k,v=e.target.value;
  try{await writeOps([{key,fields:{Kind:ov.get(key)?.Kind||'line',CRDOverride:v}}]);await loadOverlay();rebuild();toast('Backorder date saved');}
  catch(err){toast('Could not save date: '+err.message,6000);}
});

/* ---------- dialogs ---------- */
const dlg=$('dlg');let dlgCtl=null;
function openDlg(title,body,okLabel,onOk,wide){
  dlg.classList.toggle('wide',!!wide);
  $('dlgBody').innerHTML=`<h3>${title}</h3>${body}<div class="err" id="dErr"></div><div class="acts"><button id="dCancel">Cancel</button>${okLabel?`<button class="primary" id="dOk">${okLabel}</button>`:''}</div>`;
  dlg.showModal();
  $('dCancel').onclick=()=>{if(dlgCtl){dlgCtl.abort();$('dCancel').textContent='Stopping…';}else dlg.close();};
  dlg.oncancel=e=>{if(dlgCtl){e.preventDefault();dlgCtl.abort();}};
  if(onOk)$('dOk').onclick=async()=>{
    $('dErr').textContent='';$('dOk').disabled=true;dlgCtl=new AbortController();
    try{const keep=await onOk(dlgCtl.signal);if(!keep)dlg.close();}
    catch(err){$('dErr').textContent=err.message;}
    finally{dlgCtl=null;if(dlg.open){$('dOk').disabled=false;$('dCancel').textContent='Cancel';}}
  };
}
function toast(t,ms=3000){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',ms);}
const prog=(a,b)=>{const p=$('dProg');if(p)p.textContent=`Saved ${a} of ${b}…`;};
async function afterWrite(res,verb){
  await loadOverlay();rebuild();
  const partial=res.done<res.total;
  toast(`${verb} ${res.done.toLocaleString()} of ${res.total.toLocaleString()} update${res.total===1?'':'s'}${partial?' — stopped early':''}${res.fails.length?` · ${res.fails.length} failed`:''}`,partial||res.fails.length?7000:3000);
  if(res.fails.length)console.warn(res.fails);
}
const shipOps=(ls,d)=>ls.map(l=>({key:l.key,fields:{Kind:ov.get(l.key)?.Kind||(l.split?'split':'line'),PONumber:l.po,Style:l.sty,Shipped:true,ShippedDate:d,ShippedBy:account.name||account.username}}));
const dateRow=`<div class="row"><label class="lbl" for="dDate">Ship date</label><input type="date" id="dDate" value="${isoDay(todayDay())}"></div>`;
$('btnShip').onclick=()=>st.view==='po'?shipPOs():shipLines();
function shipPOs(){
  const ls=selLines(l=>l.status==='open'),n=new Set(ls.map(l=>l.po)).size;
  openDlg('Mark POs shipped',`<p class="note">${n} PO${n===1?'':'s'} (${ls.length} style line${ls.length===1?'':'s'}) will be marked shipped in full. To ship part of a style, use the Styles view.</p>${dateRow.replace(isoDay(todayDay()),isoDay(T0()))}<div class="note" id="dProg"></div>`,'Mark shipped',async signal=>{
    const d=$('dDate').value;if(!d)throw new Error('Pick a ship date.');
    const res=await writeOps(shipOps(ls,d),signal,prog);
    ls.forEach(l=>selP.delete(l.po));await afterWrite(res,'Marked shipped:');
  });
}
function shipLines(){
  const ls=selLines(l=>l.status==='open').sort(cmpPO);
  const rows=ls.map(l=>`<tr data-k="${esc(l.key)}"><td>${esc(l.po)}</td><td>${esc(l.sty)}</td><td class="num">${int(l.qty)}</td><td><input type="number" class="sqq" min="1" ${l.qty!=null?`max="${l.qty}" value="${l.qty}"`:'disabled'}></td><td class="sqb">—</td></tr>`).join('');
  openDlg('Confirm qty shipped',`${dateRow.replace(isoDay(todayDay()),isoDay(T0()))}<p class="note">Check the qty shipped for each style. Anything short becomes a backorder line (-1, -2…) and needs its Factory CRD.</p>
    <div class="sq"><table><thead><tr><th>PO #</th><th>Style#</th><th>Open qty</th><th>Qty shipped</th><th>Backorder · qty · Factory CRD</th></tr></thead><tbody id="sqBody">${rows}</tbody></table></div><div class="note" id="dProg"></div>`,'Mark shipped',async signal=>{
    const d=$('dDate').value;if(!d)throw new Error('Pick a ship date.');
    const ops=[],errs=[];
    for(const tr of $('sqBody').querySelectorAll('tr')){
      const l=lineMap.get(tr.dataset.k);if(!l)continue;
      if(l.qty!=null){
        const q=Math.round(+tr.querySelector('.sqq').value);
        if(!(q>=1&&q<=l.qty)){errs.push(`${l.po} ${l.sty}: qty shipped must be 1–${int(l.qty)}`);continue;}
        if(q<l.qty){
          const bd=tr.querySelector('.sqd')?.value;if(!bd){errs.push(`${l.po} ${l.sty}: backorder Factory CRD needed`);continue;}
          const bpo=nextSuffix(l),key=(bpo+'|'+normSty(l.sty)).toUpperCase();
          if(lineMap.has(key)){errs.push(`${bpo} already has a line for ${l.sty}`);continue;}
          ops.push({key,fields:{Kind:'split',PONumber:bpo,Style:l.sty,ParentKey:l.key,Qty:l.qty-q,CRDOverride:bd}});
        }
      }
      ops.push(...shipOps([l],d));
    }
    if(errs.length)throw new Error(errs.slice(0,8).join('\n')+(errs.length>8?`\n…and ${errs.length-8} more`:''));
    const res=await writeOps(ops,signal,prog);
    ls.forEach(l=>selL.delete(l.key));await afterWrite(res,'Saved:');
  },true);
  $('sqBody').addEventListener('input',e=>{
    if(!e.target.classList.contains('sqq'))return;
    const tr=e.target.closest('tr'),l=lineMap.get(tr.dataset.k),q=Math.round(+e.target.value),c=tr.querySelector('.sqb');
    if(l&&l.qty!=null&&q>=1&&q<l.qty){const keep=c.querySelector('.sqd')?.value||'';c.innerHTML=`${esc(nextSuffix(l))} · ${int(l.qty-q)} <input type="date" class="sqd" value="${keep}">`;}
    else c.textContent='—';
  });
}
$('btnUnship').onclick=async()=>{
  const ls=selLines(l=>l.manual);$('btnUnship').disabled=true;
  try{const res=await writeOps(ls.map(l=>({key:l.key,fields:{Shipped:false,ShippedDate:'',ShippedBy:''}})));
    if(st.view==='po')ls.forEach(l=>selP.delete(l.po));else ls.forEach(l=>selL.delete(l.key));
    await afterWrite(res,'Moved back to Open:');}
  catch(e){toast('Could not update: '+e.message,6000);}finally{updateSel();}
};
function nextSuffix(l){
  const root=l.po.replace(/-\d+$/,'');let n=0;
  for(const x of lines)if(normSty(x.sty)===normSty(l.sty)){const m=x.po.match(/^(.*)-(\d+)$/);if(m&&m[1]===root)n=Math.max(n,+m[2]);}
  return root+'-'+(n+1);
}
function splitDlg(l){
  openDlg(`Backorder · ${esc(l.po)} · ${esc(l.sty)}`,`<p class="note">Moves part of this line to its own backorder line with its own Factory CRD. Current qty ${int(l.qty)}.</p>
    <div class="row"><label class="lbl" for="dPo">Backorder PO #</label><input id="dPo" value="${esc(nextSuffix(l))}"></div>
    <div class="row"><label class="lbl" for="dQty">Backorder qty</label><input id="dQty" type="number" min="1" max="${(l.qty||0)-1}"></div>
    <div class="row"><label class="lbl" for="dCrd">Backorder Factory CRD</label><input id="dCrd" type="date"></div>`,'Create backorder',async()=>{
    const po=$('dPo').value.trim(),q=Math.round(+$('dQty').value),d=$('dCrd').value;
    if(!po)throw new Error('Enter the backorder PO #.');
    if(!(q>=1&&q<(l.qty||0)))throw new Error(`Qty must be between 1 and ${int((l.qty||0)-1)}.`);
    if(!d)throw new Error('Pick the backorder Factory CRD.');
    const key=(po+'|'+normSty(l.sty)).toUpperCase();
    if(lineMap.has(key))throw new Error(`${po} already has a line for ${l.sty}.`);
    const res=await writeOps([{key,fields:{Kind:'split',PONumber:po,Style:l.sty,ParentKey:l.key,Qty:q,CRDOverride:d}}]);
    if(res.fails.length)throw new Error(res.fails.join('\n'));
    await afterWrite(res,'Backorder created:');
  });
}
async function unsplit(l){
  try{const res=await writeOps([{key:l.key,del:true}]);await afterWrite(res,'Backorder removed:');}catch(e){toast('Could not remove: '+e.message,6000);}
}
$('btnSettings').onclick=()=>{
  openDlg('Settings',`<p class="note">Shared with everyone who uses the PO Book.</p>
    <div class="row"><label class="lbl" for="sLa">LA transit offset (days)</label><input id="sLa" type="number" min="0" value="${cfg.la}"></div>
    <div class="row"><label class="lbl" for="sAmb">Tight buffer — up to (days)</label><input id="sAmb" type="number" min="0" value="${cfg.amber}"></div>
    <div class="row"><label class="lbl" for="sRef">Auto-refresh every (minutes)</label><input id="sRef" type="number" min="1" value="${cfg.refresh}"></div>`,'Save',async()=>{
    const la=+$('sLa').value,amber=+$('sAmb').value,refresh=+$('sRef').value;
    if([la,amber].some(v=>!(v>=0))||!(refresh>=1))throw new Error('Enter whole numbers (refresh at least 1 minute).');
    const prev={...cfg};Object.assign(cfg,{la:Math.round(la),amber:Math.round(amber),refresh:Math.round(refresh)});
    try{await saveCfg();}catch(e){cfg=prev;throw e;}
    rebuild();schedule();toast('Settings saved');
  });
};

/* ---------- export ---------- */
const XF={name:'Calibri',sz:11};
const dcell=d=>d==null?{t:'s',v:''}:{t:'n',v:d+25569,z:'m/d/yyyy'};
function makeSheet(H,W,data,bufCol,isOpen){
  const enc=XLSX.utils.encode_cell,ws={};
  H.forEach((h,c)=>ws[enc({r:0,c})]={t:'s',v:h,s:{font:{...XF,bold:true}}});
  data.forEach(({cells,buf},i)=>{
    cells.forEach((c,ci)=>{c.s={font:XF};ws[enc({r:i+1,c:ci})]=c;});
    if(isOpen&&buf!=null&&buf<=cfg.amber)cells[bufCol].s.fill={patternType:'solid',fgColor:{rgb:buf<0?'F8CBAD':'FFE699'}};
  });
  const ref=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(data.length,1),c:H.length-1}});
  ws['!ref']=ref;ws['!autofilter']={ref};ws['!cols']=W.map(wch=>({wch}));
  return ws;
}
const stamp=()=>{const d=new Date();return`${d.getMonth()+1}-${d.getDate()}-${String(d.getFullYear()).slice(2)}`;};
const txt=v=>({t:'s',v:v??''}),nm=(v,z)=>v==null?txt(''):{t:'n',v,z};
$('btnExport').onclick=()=>st.view==='po'?exportPOs():exportLines();
function exportLines(){
  const sel=[...selL].map(k=>lineMap.get(k)).filter(Boolean).sort(cmpPO),wb=XLSX.utils.book_new();
  const H=['PO Date','PO #','Style#','Description','Supplier','PO Qty','Price','Factory CRD','PO Type','Cust. Name','Customer PO#','Cust. Start','Cust. Cancel','Buffer Time'];
  for(const tab of['Open','Shipped']){
    const data=sel.filter(l=>(l.status==='open')===(tab==='Open')).map((l,i)=>{const n=i+2;return{buf:l.buf,cells:[dcell(l.od),txt(l.po),txt(l.sty),txt(l.desc),txt(l.sup),nm(l.qty,'#,##0'),nm(l.price,'$0.00##'),
      dcell(l.crd),txt(l.ptype),txt(l.cust),txt(l.cpo),dcell(l.cs),dcell(l.cc),
      {t:l.buf==null?'s':'n',v:l.buf??'',f:`IF(OR(H${n}="",L${n}=""),"",IF(I${n}="LA",L${n}-${cfg.la}-H${n},L${n}-H${n}))`,z:'0'}]};});
    XLSX.utils.book_append_sheet(wb,makeSheet(H,[11,12,12,38,14,9,8,11,12,16,16,11,11,11],data,13,tab==='Open'),tab);
  }
  XLSX.writeFile(wb,`M1S_PO_Book_${stamp()}_V1.xlsx`);
}
function exportPOs(){
  const wb=XLSX.utils.book_new(),all={Open:poRows('open',false),Shipped:poRows('shipped',false)};
  const H=['PO Date','PO #','Supplier','Styles','PO Qty','PO Value','Factory CRD','PO Type','Cust. Name','Customer PO#','Cust. Start','Cust. Cancel','Buffer Time'];
  for(const tab of['Open','Shipped']){
    const data=all[tab].filter(r=>selP.has(r.po)).map((r,i)=>{const n=i+2;return{buf:r.buf,cells:[dcell(r.od),txt(r.po),txt(r.sup),nm(r.styles,'0'),nm(r.qty,'#,##0'),nm(r.val,'$#,##0.00'),
      dcell(r.crd),txt(r.ptype),txt(r.cust),txt(r.cpo),dcell(r.cs),dcell(r.cc),
      r.ptype==='Mixed'?nm(r.buf,'0'):{t:r.buf==null?'s':'n',v:r.buf??'',f:`IF(OR(G${n}="",K${n}=""),"",IF(H${n}="LA",K${n}-${cfg.la}-G${n},K${n}-G${n}))`,z:'0'}]};});
    XLSX.utils.book_append_sheet(wb,makeSheet(H,[11,12,16,8,10,13,11,12,16,18,11,11,11],data,12,tab==='Open'),tab);
  }
  XLSX.writeFile(wb,`M1S_PO_Book_POs_${stamp()}_V1.xlsx`);
}

initAuth();
</script>
